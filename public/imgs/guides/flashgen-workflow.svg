<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">FlashGen setup workflow</title><desc id="desc">Verify the baseline, select a merged or dynamic loading route, then run a controlled test.</desc>
<defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#ffffff04"/></pattern><radialGradient id="ball" cx="30%" cy="22%"><stop stop-color="#ffdac6"/><stop offset="0.6" stop-color="#efac96"/><stop offset="1" stop-color="#ae5f4e"/></radialGradient></defs>
<rect width="1200" height="680" fill="#0e171e"/><rect width="1200" height="680" fill="url(#grid)"/>
<g font-family="Arial, sans-serif"><text x="48" y="49" font-size="16" fill="#a4e5ed" font-family="ui-monospace, monospace" letter-spacing="2">H3 FIELD NOTES</text><text x="1150" y="49" font-size="14" fill="#91a2ad" text-anchor="end" font-family="ui-monospace, monospace" letter-spacing="2">EXPLAINED</text><text x="48" y="119" font-size="49" fill="#eef3f4" >One setup. One loading path.</text><text x="48" y="164" font-size="23" fill="#91a2ad" >A suggested first-run sequence for a compatible runtime.</text><rect x="48" y="211" width="1104" height="83" rx="14" fill="#141e25" stroke="#ffffff16"/><text x="76" y="245" font-size="16" fill="#a4e5ed" font-family="ui-monospace, monospace" letter-spacing="2">01 / VERIFY THE BASE</text><text x="76" y="276" font-size="25" fill="#eef3f4" >Save a working H3 clip, prompt, seed, and software version.</text><path d="M600 294 L600 324" fill="none" stroke="#39535e" stroke-width="2" /><path d="M300 324 L900 324" fill="none" stroke="#39535e" stroke-width="2" /><path d="M300 324 L300 350" fill="none" stroke="#39535e" stroke-width="2" /><path d="M900 324 L900 350" fill="none" stroke="#39535e" stroke-width="2" /><rect x="48" y="350" width="534" height="124" rx="14" fill="#141e25" stroke="#ffffff16"/><rect x="618" y="350" width="534" height="124" rx="14" fill="#141e25" stroke="#ffffff16"/><text x="76" y="385" font-size="16" fill="#a4e5ed" font-family="ui-monospace, monospace" letter-spacing="2">02A / MERGED CHECKPOINT</text><text x="76" y="422" font-size="24" fill="#eef3f4" >Use the publisher’s merge route.</text><text x="76" y="451" font-size="19" fill="#91a2ad" >Keep its schedule with the checkpoint.</text><text x="646" y="385" font-size="16" fill="#a4e5ed" font-family="ui-monospace, monospace" letter-spacing="2">02B / DYNAMIC ADAPTER</text><text x="646" y="422" font-size="24" fill="#eef3f4" >Use the runtime’s native artifact.</text><text x="646" y="451" font-size="19" fill="#91a2ad" >Do not apply it on a merged copy.</text><path d="M300 474 L300 501" fill="none" stroke="#39535e" stroke-width="2" /><path d="M900 474 L900 501" fill="none" stroke="#39535e" stroke-width="2" /><path d="M300 501 L900 501" fill="none" stroke="#39535e" stroke-width="2" /><path d="M600 501 L600 522" fill="none" stroke="#39535e" stroke-width="2" /><rect x="48" y="522" width="1104" height="65" rx="14" fill="#142b34" stroke="#a4e5ed40"/><text x="76" y="563" font-size="23" fill="#a4e5ed" >03 / Fixed seed + documented 4-step schedule → inspect video and audio</text>
<path d="M48 616 L1152 616" fill="none" stroke="#ffffff16" stroke-width="2" /><text x="48" y="649" font-size="13" fill="#91a2ad" font-family="ui-monospace, monospace" letter-spacing="2">ORIGINAL SCHEMATIC / NOT MODEL OUTPUT</text><text x="1152" y="649" font-size="13" fill="#91a2ad" text-anchor="end" font-family="ui-monospace, monospace" letter-spacing="2">MINIMAX H3</text></g></svg>