<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">VBVR object consistency</title><desc id="desc">The same illustrated ball moves through a scene and remains recognizable after occlusion.</desc>
<defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#ffffff04"/></pattern><radialGradient id="ball" cx="30%" cy="22%"><stop stop-color="#ffdac6"/><stop offset="0.6" stop-color="#efac96"/><stop offset="1" stop-color="#ae5f4e"/></radialGradient></defs>
<rect width="1200" height="680" fill="#0e171e"/><rect width="1200" height="680" fill="url(#grid)"/>
<g font-family="Arial, sans-serif"><text x="48" y="49" font-size="16" fill="#efac96" font-family="ui-monospace, monospace" letter-spacing="2">H3 FIELD NOTES</text><text x="1150" y="49" font-size="14" fill="#91a2ad" text-anchor="end" font-family="ui-monospace, monospace" letter-spacing="2">EXPLAINED</text><text x="48" y="119" font-size="46" fill="#eef3f4" >Same object. Through every frame.</text><text x="48" y="164" font-size="23" fill="#91a2ad" >VBVR: a consistency goal you can test.</text><rect x="48" y="213" width="352" height="303" rx="14" fill="#171e23" stroke="#ffffff16"/><text x="70" y="249" font-size="15" fill="#efac96" font-family="ui-monospace, monospace" letter-spacing="2">01 / BEFORE</text><path d="M71 422 L223 340 L378 419 L223 493Z" fill="#28353c" stroke="#52616a"/><ellipse cx="126" cy="419" rx="36" ry="12" fill="#050c11" opacity="0.55"/><circle cx="126" cy="377" r="31" fill="url(#ball)" /><path d="M82 453 Q214 487 363 453" fill="none" stroke="#efac96" stroke-width="2" stroke-dasharray="5 8"/><text x="223" y="552" font-size="23" fill="#efac96" text-anchor="middle">One object</text><rect x="424" y="213" width="352" height="303" rx="14" fill="#171e23" stroke="#ffffff16"/><text x="446" y="249" font-size="15" fill="#efac96" font-family="ui-monospace, monospace" letter-spacing="2">02 / OCCLUDED</text><path d="M447 422 L599 340 L754 419 L599 493Z" fill="#28353c" stroke="#52616a"/><ellipse cx="597" cy="419" rx="36" ry="12" fill="#050c11" opacity="0.55"/><circle cx="597" cy="377" r="31" fill="url(#ball)" /><path d="M594 340 L662 365 V438 L594 412Z" fill="#66747a"/><path d="M594 340 L627 321 L694 346 L662 365Z" fill="#869194"/><path d="M662 365 L694 346 V420 L662 438Z" fill="#45565f"/><path d="M458 453 Q590 487 739 453" fill="none" stroke="#efac96" stroke-width="2" stroke-dasharray="5 8"/><text x="599" y="552" font-size="23" fill="#efac96" text-anchor="middle">Continuous path</text><rect x="800" y="213" width="352" height="303" rx="14" fill="#171e23" stroke="#ffffff16"/><text x="822" y="249" font-size="15" fill="#efac96" font-family="ui-monospace, monospace" letter-spacing="2">03 / AFTER</text><path d="M823 422 L975 340 L1130 419 L975 493Z" fill="#28353c" stroke="#52616a"/><ellipse cx="1077" cy="419" rx="36" ry="12" fill="#050c11" opacity="0.55"/><circle cx="1077" cy="377" r="31" fill="url(#ball)" /><path d="M834 453 Q966 487 1115 453" fill="none" stroke="#efac96" stroke-width="2" stroke-dasharray="5 8"/><text x="975" y="552" font-size="23" fill="#efac96" text-anchor="middle">Same identity</text><text x="48" y="594" font-size="16" fill="#91a2ad" font-family="ui-monospace, monospace" letter-spacing="2">ILLUSTRATED GOAL / NOT A GUARANTEED OUTCOME</text>
<path d="M48 616 L1152 616" fill="none" stroke="#ffffff16" stroke-width="2" /><text x="48" y="649" font-size="13" fill="#91a2ad" font-family="ui-monospace, monospace" letter-spacing="2">ORIGINAL SCHEMATIC / NOT MODEL OUTPUT</text><text x="1152" y="649" font-size="13" fill="#91a2ad" text-anchor="end" font-family="ui-monospace, monospace" letter-spacing="2">MINIMAX H3</text></g></svg>