<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">FlashGen evaluation checklist</title><desc id="desc">Evaluate total time, usable quality, and repeatability. No benchmark results are shown.</desc>
<defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#ffffff04"/></pattern><radialGradient id="ball" cx="30%" cy="22%"><stop stop-color="#ffdac6"/><stop offset="0.6" stop-color="#efac96"/><stop offset="1" stop-color="#ae5f4e"/></radialGradient></defs>
<rect width="1200" height="680" fill="#0e171e"/><rect width="1200" height="680" fill="url(#grid)"/>
<g font-family="Arial, sans-serif"><text x="48" y="49" font-size="16" fill="#a4e5ed" font-family="ui-monospace, monospace" letter-spacing="2">H3 FIELD NOTES</text><text x="1150" y="49" font-size="14" fill="#91a2ad" text-anchor="end" font-family="ui-monospace, monospace" letter-spacing="2">EXPLAINED</text><text x="48" y="119" font-size="49" fill="#eef3f4" >Measure what makes a keeper.</text><text x="48" y="164" font-size="23" fill="#91a2ad" >Use the same workload. Record every attempt.</text><rect x="48" y="214" width="1104" height="101" rx="14" fill="#141e25" stroke="#ffffff16"/><text x="74" y="274" font-size="32" fill="#a4e5ed" font-family="ui-monospace, monospace" letter-spacing="2">01</text><path d="M143 236 L143 293" fill="none" stroke="#39535e" stroke-width="2" /><text x="170" y="275" font-size="30" fill="#eef3f4" >Complete time</text><text x="550" y="256" font-size="23" fill="#eef3f4" >Submission to playable video.</text><text x="550" y="288" font-size="20" fill="#91a2ad" >Separate warm-up from repeats.</text><rect x="48" y="335" width="1104" height="101" rx="14" fill="#141e25" stroke="#ffffff16"/><text x="74" y="395" font-size="32" fill="#a4e5ed" font-family="ui-monospace, monospace" letter-spacing="2">02</text><path d="M143 357 L143 414" fill="none" stroke="#39535e" stroke-width="2" /><text x="170" y="396" font-size="30" fill="#eef3f4" >Usable quality</text><text x="550" y="377" font-size="23" fill="#eef3f4" >Watch motion and listen to audio.</text><text x="550" y="409" font-size="20" fill="#91a2ad" >Count retries as part of the work.</text><rect x="48" y="456" width="1104" height="101" rx="14" fill="#141e25" stroke="#ffffff16"/><text x="74" y="516" font-size="32" fill="#a4e5ed" font-family="ui-monospace, monospace" letter-spacing="2">03</text><path d="M143 478 L143 535" fill="none" stroke="#39535e" stroke-width="2" /><text x="170" y="517" font-size="30" fill="#eef3f4" >Repeatability</text><text x="550" y="498" font-size="23" fill="#eef3f4" >Save the full configuration.</text><text x="550" y="530" font-size="20" fill="#91a2ad" >Repeat with recorded seeds.</text><text x="48" y="594" font-size="17" fill="#a4e5ed" font-family="ui-monospace, monospace" letter-spacing="2">FEWER STEPS ≠ A UNIVERSAL END-TO-END SPEEDUP</text>
<path d="M48 616 L1152 616" fill="none" stroke="#ffffff16" stroke-width="2" /><text x="48" y="649" font-size="13" fill="#91a2ad" font-family="ui-monospace, monospace" letter-spacing="2">ORIGINAL SCHEMATIC / NOT MODEL OUTPUT</text><text x="1152" y="649" font-size="13" fill="#91a2ad" text-anchor="end" font-family="ui-monospace, monospace" letter-spacing="2">MINIMAX H3</text></g></svg>