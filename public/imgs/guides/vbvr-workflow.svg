<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">VBVR image-to-video setup</title><desc id="desc">Reference image, compatible H3 LoRA loader, controlled sampling, and full-video review.</desc>
<defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#ffffff04"/></pattern><radialGradient id="ball" cx="30%" cy="22%"><stop stop-color="#ffdac6"/><stop offset="0.6" stop-color="#efac96"/><stop offset="1" stop-color="#ae5f4e"/></radialGradient></defs>
<rect width="1200" height="680" fill="#0e171e"/><rect width="1200" height="680" fill="url(#grid)"/>
<g font-family="Arial, sans-serif"><text x="48" y="49" font-size="16" fill="#efac96" font-family="ui-monospace, monospace" letter-spacing="2">H3 FIELD NOTES</text><text x="1150" y="49" font-size="14" fill="#91a2ad" text-anchor="end" font-family="ui-monospace, monospace" letter-spacing="2">EXPLAINED</text><text x="48" y="119" font-size="46" fill="#eef3f4" >Keep the experiment controlled.</text><text x="48" y="164" font-size="23" fill="#91a2ad" >Conceptual H3 image-to-video workflow with a VBVR adapter.</text><rect x="48" y="237" width="258" height="222" rx="14" fill="#141e25" stroke="#ffffff16"/><text x="69" y="274" font-size="15" fill="#efac96" font-family="ui-monospace, monospace" letter-spacing="2">01 / INPUT</text><text x="69" y="375" font-size="26" fill="#eef3f4" >Reference image</text><text x="69" y="412" font-size="17" fill="#91a2ad" >One clear interaction</text><rect x="72" y="296" width="69" height="45" rx="5" fill="#26383f" stroke="#91a2ad50"/><circle cx="110" cy="317" r="12" fill="#efac96" /><path d="M313 345 L327 345" fill="none" stroke="#efac96" stroke-width="2" /><path d="M318 339 L327 345 L318 351" fill="none" stroke="#efac96" stroke-width="2"/><rect x="330" y="237" width="258" height="222" rx="14" fill="#141e25" stroke="#ffffff16"/><text x="351" y="274" font-size="15" fill="#efac96" font-family="ui-monospace, monospace" letter-spacing="2">02 / MODEL</text><text x="351" y="375" font-size="26" fill="#eef3f4" >H3 + VBVR</text><text x="351" y="412" font-size="17" fill="#91a2ad" >A compatible loader</text><rect x="354" y="296" width="78" height="18" rx="4" fill="#30454d" stroke="none"/><rect x="354" y="321" width="78" height="18" rx="4" fill="#754f46" stroke="none"/><path d="M595 345 L609 345" fill="none" stroke="#efac96" stroke-width="2" /><path d="M600 339 L609 345 L600 351" fill="none" stroke="#efac96" stroke-width="2"/><rect x="612" y="237" width="258" height="222" rx="14" fill="#141e25" stroke="#ffffff16"/><text x="633" y="274" font-size="15" fill="#efac96" font-family="ui-monospace, monospace" letter-spacing="2">03 / SAMPLE</text><text x="633" y="375" font-size="26" fill="#eef3f4" >Fixed settings</text><text x="633" y="412" font-size="17" fill="#91a2ad" >Same prompt and seed</text><path d="M636 306 L717 306" fill="none" stroke="#91a2ad" stroke-width="2" /><circle cx="666" cy="306" r="6" fill="#efac96" /><path d="M636 331 L717 331" fill="none" stroke="#91a2ad" stroke-width="2" /><circle cx="699" cy="331" r="6" fill="#efac96" /><path d="M877 345 L891 345" fill="none" stroke="#efac96" stroke-width="2" /><path d="M882 339 L891 345 L882 351" fill="none" stroke="#efac96" stroke-width="2"/><rect x="894" y="237" width="258" height="222" rx="14" fill="#141e25" stroke="#ffffff16"/><text x="915" y="274" font-size="15" fill="#efac96" font-family="ui-monospace, monospace" letter-spacing="2">04 / REVIEW</text><text x="915" y="375" font-size="26" fill="#eef3f4" >Full video</text><text x="915" y="412" font-size="17" fill="#91a2ad" >Inspect every phase</text><path d="M922 302 L972 319 L922 337Z" fill="#efac96"/><rect x="48" y="499" width="1104" height="83" rx="14" fill="#2a2525" stroke="#efac9630"/><text x="76" y="533" font-size="15" fill="#efac96" font-family="ui-monospace, monospace" letter-spacing="2">BASELINE vs CANDIDATE</text><text x="76" y="565" font-size="23" fill="#eef3f4" >Change the adapter. Keep the image, prompt, seed, duration, and sampler.</text>
<path d="M48 616 L1152 616" fill="none" stroke="#ffffff16" stroke-width="2" /><text x="48" y="649" font-size="13" fill="#91a2ad" font-family="ui-monospace, monospace" letter-spacing="2">ORIGINAL SCHEMATIC / NOT MODEL OUTPUT</text><text x="1152" y="649" font-size="13" fill="#91a2ad" text-anchor="end" font-family="ui-monospace, monospace" letter-spacing="2">MINIMAX H3</text></g></svg>