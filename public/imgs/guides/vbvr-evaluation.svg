<g font-family="Arial, sans-serif"><text x="48" y="49" font-size="16" fill="#efac96" font-family="ui-monospace, monospace" letter-spacing="2">H3 FIELD NOTES</text><text x="1150" y="49" font-size="14" fill="#91a2ad" text-anchor="end" font-family="ui-monospace, monospace" letter-spacing="2">EXPLAINED</text><text x="48" y="119" font-size="46" fill="#eef3f4" >Three checks. The whole action.</text><text x="48" y="164" font-size="23" fill="#91a2ad" >Review the interaction, not just a beautiful first frame.</text><rect x="48" y="213" width="352" height="354" rx="14" fill="#141e25" stroke="#ffffff16"/><text x="72" y="252" font-size="18" fill="#efac96" font-family="ui-monospace, monospace" letter-spacing="2">01</text><circle cx="223" cy="354" r="45" fill="url(#ball)" /><circle cx="223" cy="354" r="70" fill="none" stroke="#efac9670" stroke-dasharray="5 7"/><text x="72" y="479" font-size="28" fill="#eef3f4" >Object count</text><text x="72" y="518" font-size="20" fill="#91a2ad" >One stays one.</text><rect x="424" y="213" width="352" height="354" rx="14" fill="#141e25" stroke="#ffffff16"/><text x="448" y="252" font-size="18" fill="#efac96" font-family="ui-monospace, monospace" letter-spacing="2">02</text><rect x="479" y="388" width="242" height="13" rx="3" fill="#49636c" stroke="none"/><circle cx="599" cy="351" r="37" fill="url(#ball)" /><path d="M537 389 L661 389" fill="none" stroke="#efac96" stroke-width="2" /><text x="448" y="479" font-size="28" fill="#eef3f4" >Clean contact</text><text x="448" y="518" font-size="20" fill="#91a2ad" >Boundaries stay readable.</text><rect x="800" y="213" width="352" height="354" rx="14" fill="#141e25" stroke="#ffffff16"/><text x="824" y="252" font-size="18" fill="#efac96" font-family="ui-monospace, monospace" letter-spacing="2">03</text><circle cx="882" cy="355" r="27" fill="url(#ball)" /><circle cx="1070" cy="355" r="27" fill="url(#ball)" /><rect x="942" y="306" width="68" height="100" rx="7" fill="#45565f" stroke="#7c8f98"/><path d="M910 353 H941 M1010 353 H1042" fill="none" stroke="#efac96" stroke-dasharray="4 5"/><text x="824" y="479" font-size="24" fill="#eef3f4" >Identity after occlusion</text><text x="824" y="518" font-size="20" fill="#91a2ad" >Same color, shape, and size.</text><text x="48" y="597" font-size="16" fill="#efac96" font-family="ui-monospace, monospace" letter-spacing="2">PASS / UNCERTAIN / FAIL — KEEP EVERY OUTPUT</text>
