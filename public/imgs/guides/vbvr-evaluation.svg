<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">VBVR consistency review</title><desc id="desc">Schematic criteria: stable object count, plausible contact, and stable identity after occlusion.</desc>
